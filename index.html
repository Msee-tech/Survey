<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Diet and Mental Wellbeing Survey</title>
<style>
:root{--g:#14513f;--g2:#0c3a2d;--bg:#edf1ed;--ink:#1b2721;--mut:#5a6a62;--ln:#ccd6cf;--gold:#b9781a;--bad:#b3402c}
*{box-sizing:border-box}html{scroll-padding-top:56px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--g2);color:#fff;padding:env(safe-area-inset-top) 16px 0}
header span{display:block;padding:8px 0 6px;font-size:13px;opacity:.9}
.bar{height:4px;background:#ffffff33;margin:0 -16px}.bar i{display:block;height:100%;width:0;background:#e8b04a;transition:width .3s}
main{max-width:680px;margin:0 auto;padding:20px 16px 48px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.2;color:var(--g2)}
h1{font-size:28px;margin:8px 0}h2{font-size:23px;margin:4px 0 6px}
.sub{font-weight:600;color:var(--g);margin:0 0 16px;font-size:14px}.lead{color:var(--mut);margin:0 0 16px}
.card{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:16px;margin:12px 0}
.q{background:#fff;border:1px solid var(--ln);border-radius:10px;padding:14px;margin:10px 0}
.q.bad{border-color:var(--bad);box-shadow:0 0 0 2px #b3402c33}
.ql{margin:0 0 10px;font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:8px}.g4{display:grid;grid-template-columns:1fr 1fr}.g7{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.chip{font:inherit;min-height:44px;padding:8px 14px;border:1.5px solid var(--ln);background:#fff;border-radius:8px;color:var(--ink);cursor:pointer}
.g7 .chip{padding:8px 0;font-weight:600}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
.chip:focus-visible,.btn:focus-visible,.in:focus-visible,input[type=checkbox]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.in{width:100%;font:inherit;padding:11px 12px;border:1.5px solid var(--ln);border-radius:8px;background:#fff}
.sp{margin-top:10px}
.cat{margin:26px 0 4px;font-size:19px}
.key{position:sticky;top:38px;z-index:4;background:#fff;border:1px solid var(--ln);border-radius:8px;padding:8px 10px;font-size:11.5px;line-height:1.5;color:var(--mut);margin-bottom:6px}
.key b{color:var(--g2)}
.fh{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}.fh span{font-weight:600}.fh small{color:var(--g);text-align:right}
.ffq{padding:10px 12px}
.care{background:#fff6e0;border:1px solid #e3c46f;border-radius:8px;padding:12px;margin:10px 0 0;font-size:14.5px}
.chk{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--ln);border-radius:10px;padding:14px;margin:10px 0;cursor:pointer}
.chk input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--g)}
.btn{font:inherit;font-weight:600;min-height:48px;padding:10px 22px;border:0;border-radius:10px;background:var(--g);color:#fff;cursor:pointer}
.btn:disabled{opacity:.6}.btn.ghost{background:transparent;color:var(--g);border:1.5px solid var(--g)}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:22px}.nav .btn:only-child{margin-left:auto}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;font:inherit;padding:14px 0;cursor:pointer}
.err{color:var(--bad);font-weight:600}
.frame{position:relative;background:#16211c;border-radius:10px;aspect-ratio:4/3;overflow:hidden;display:grid;place-items:center}
.frame video,.frame img{width:100%;height:100%;object-fit:cover}.frame .ph{color:#9fb0a7;margin:0}
.selfie video{transform:scaleX(-1)}
.cam[data-state=idle] video,.cam[data-state=idle] img,.cam[data-state=live] img,.cam[data-state=live] .ph,.cam[data-state=done] video,.cam[data-state=done] .ph{display:none}
.cam[data-state=idle] [data-act=snap],.cam[data-state=done] [data-act=snap],.cam[data-state=live] [data-act=start]{display:none}
.cam .row{display:flex;gap:10px;margin-top:10px}
.cerr{color:var(--bad);font-size:14px;margin:8px 0 0}
.setup{background:#fff6e0;border:1px solid #e3c46f;border-radius:8px;padding:12px;margin-top:16px;font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--g2);color:#fff;padding:12px 18px;border-radius:10px;max-width:90%;display:none;z-index:9;font-size:14.5px}
@media(max-width:380px){.chip{padding:8px 10px}}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style></head><body>
<header><span id="stepname"></span><div class="bar"><i id="fill"></i></div></header>
<main id="app"></main><div id="toast" role="status"></div>
<noscript><p style="padding:20px">Please turn on JavaScript to answer this questionnaire.</p></noscript>
<script>
/* ===== SETTINGS: edit these ===== */
const CONFIG={
  ENDPOINT:"https://script.google.com/macros/s/AKfycbxD2uszbAJ5zAm7kL_ac-HFDtGC6oU-8pY4sKZJnRXAXDu2aGJLRK93PlelTelxZ9Bp/exec",            // paste your Google Apps Script web-app URL here (see apps-script-backend.gs)
  PHOTO_REQUIRED:false,   // true = respondents must agree to the photo check to take part
  RESEARCHER:""           // e.g. "Zee, HND Nutrition & Dietetics, zee@email.com" (shown on the first page)
};
/* ================================ */
const TITLE="Association between dietary patterns and perceived symptoms of depression and anxiety among tertiary institution students in Bauchi Metropolis, Bauchi State, Nigeria";
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const A={},P={selfie:null,scene:null},C={ok:false,photo:false};let step=0,stream=null;
const NAMES=['Welcome','Photo check','Section A of E','Section B of E','Section C of E','Section D of E','Section E of E'];

const SA=[
{k:'age',q:'Age (years)',t:'n',min:15,max:60},
{k:'sex',q:'Sex',o:['Male','Female']},
{k:'inst',q:'Institution',o:['Federal Polytechnic Bauchi','ATAP']},
{k:'dept',q:'Faculty / Department',t:'x'},
{k:'level',q:'Level of study',o:['ND1','ND2','HND1','HND2','Other'],sp:'Other'},
{k:'marital',q:'Marital status',o:['Single','Married','Divorced','Separated','Widowed']},
{k:'resid',q:'Place of residence',o:['School hostel','Rented accommodation','Family home','Other'],sp:'Other'},
{k:'livewith',q:'Who do you live with?',o:['Alone','Parent','Guardian','Friends','Spouse','Other'],sp:'Other'},
{k:'support',q:'What is your source of financial support?',o:['Parent','Guardian','Self','Scholarship/Bursary','Spouse','Other'],sp:'Other'},
{k:'allow',q:'Approximately, how much do you receive for your personal expenses per month?',o:['Less than ₦20,000','₦20,000–₦30,000','More than ₦30,000']},
{k:'job',q:'Do you have a paid job/business while studying?',o:['Yes','No'],sp:'Yes'},
{k:'hh',q:'How many people are in your household?',t:'n',min:1,max:40},
{k:'chronic',q:'Do you have any diagnosed chronic medical condition?',o:['Yes','No','Prefer not to say'],sp:'Yes',spopt:1,spq:'If yes, please specify (optional)'},
{k:'meals',q:'How many times do you eat per day on average?',o:['1','2','3','More than 3']},
{k:'bfast',q:'Do you usually eat breakfast?',o:['Yes','No']},
{k:'bfreq',q:'How often do you eat breakfast?',o:['Always','Sometimes','Never']}];
const SE=[
{k:'pa',q:'Do you engage in regular physical activity or exercise?',o:['Yes, regularly (3+ times/week)','Occasionally (1–2 times/week)','Rarely/Never']},
{k:'tob',q:'Do you smoke cigarettes or use tobacco products?',o:['Yes','No']},
{k:'alc',q:'Do you consume alcohol?',o:['Never','Occasionally','Regularly']},
{k:'mhdx',q:'Have you ever been diagnosed with a mental health condition?',o:['Yes','No','Not sure']},
{k:'med',q:'Are you currently taking any medication?',o:['Yes','No'],sp:'Yes'},
{k:'mhr',q:'Overall, how would you rate your mental health in the past month?',o:['Very good','Good','Fair','Poor','Very poor']}];
const FL=['Never/rarely','1–3 times a month','1–2 times a week','3–4 times a week','5–6 times a week','Once daily','More than once daily'];
const FFQ=[
['cer','Cereals and cereal products','Rice|Maize|Millet|Sorghum|Oat|Bread|Cornflakes|Noodles|Spaghetti|Macaroni|Pap/Ogi/Akamu|White rice|Jollof rice|Fried rice|Rice and Beans'],
['leg','Legumes and legume products','Beans|Soyabeans|Groundnut|Bambara nut/Okpa|Soya milk|Akara/Kosai|Moi Moi|Beans Porridge'],
['rt','Roots and tubers','Yam|Pounded yam|Boiled yam|Fried yam|Yam porridge|Sweet potato|Irish potato|Cassava|Garri|Eba|Fufu/Akpu'],
['meat','Meat and meat products','Beef|Goat meat|Turkey|Chicken|Pomo|Kilishi|Sausage|Shaki|Egg'],
['fish','Fish and fish products','Cat fish|Dry fish|Smoked fish|Cray fish|Sardine|Canned fish'],
['milk','Milk and milk products','Fresh milk|Powdered milk|Evaporated milk|Yoghurt|Cheese|Milk shake|Fura de nono'],
['fruit','Fruits','Mango|Banana|Pawpaw|Watermelon|Pineapple|Apple|Avocado|Cashew|Date/Dabino'],
['veg','Vegetables','Ugwu|Spinach|Waterleaf|Bitter-leaf|Cucumber|Cabbage|Garden egg|Tomato'],
['proc','Processed foods','Biscuit|Doughnut|Noodles|Chocolate|Sweet/candy|Cake'],
['oil','Oils and fats','Palm oil|Groundnut oil|Soyabeans oil|Margarine|Olive oil|Butter|Mayonnaise'],
['wat','Water','Water']];
const PHQ=['Little interest in doing things','Depressed','Feeling down','Hopeless','Sleeping too much','Feeling tired or having little energy','Poor appetite','Overeating','Feeling bad about yourself that you are a failure','Trouble concentrating on things, such as reading or watching television','Moving or speaking so slowly that other people could have noticed','Being so fidgety or restless that you have been moving around a lot more than usual','Thoughts that you would be better off dead or of hurting yourself in some way'];
const GAD=['Feeling nervous','Feeling anxious','Not being able to stop or control worrying','Worrying too much about different things','Trouble relaxing','Being so restless that it is hard to sit still','Becoming easily annoyed or irritable','Feeling afraid, as if something awful might happen'];
const LK=['Not at all','Several days','More than half the days','Nearly every day'];
const CARE='Thank you for answering honestly. If you have had thoughts of hurting yourself, please talk to someone you trust, your institution\'s counselling unit, or a health worker soon. If you feel you may act on these thoughts, go to the nearest hospital or contact emergency services right away.';

const chips=(labels,vals,cls='')=>`<div class="opts ${cls}">${labels.map((l,i)=>`<button type="button" class="chip" data-v="${esc(vals?vals[i]:l)}">${esc(l)}</button>`).join('')}</div>`;
const Q=f=>`<div class="q" data-k="${f.k}"${f.spopt?' data-spopt="1"':''}><p class="ql">${f.q}</p>${f.t?`<input class="in" type="${f.t==='n'?'number':'text'}" ${f.t==='n'?`inputmode="numeric" min="${f.min}" max="${f.max}"`:''} autocomplete="off">`:chips(f.o)+(f.sp?`<input class="in sp" data-sp="${f.sp}" placeholder="${f.spq||'Please specify'}" hidden>`:'')}</div>`;
const L=(pre,items)=>items.map((t,i)=>`<div class="q" data-k="${pre}${i+1}" data-n="1"><p class="ql">${i+1}. ${t}</p>${chips(LK,[0,1,2,3],'g4')}${pre+(i+1)==='phq13'?`<p class="care" hidden>${CARE}</p>`:''}</div>`).join('');
const ffqHTML=()=>`<div class="key">${FL.map((t,i)=>`<b>${i}</b> ${t}`).join(' · ')}</div>`+FFQ.map(([c,h,l])=>`<h3 class="cat">${h}</h3>`+l.split('|').map(n=>{const k=`ffq_${c}_${n.toLowerCase().replace(/[^a-z0-9]+/g,'_')}`;return `<div class="q ffq" data-k="${k}" data-n="1"><div class="fh"><span>${n}</span><small></small></div>${chips([0,1,2,3,4,5,6],null,'g7')}</div>`}).join('')).join('');

const nav=last=>`<div class="nav">${step>0?'<button class="btn ghost" data-nav="-1">Back</button>':''}<button class="btn" data-nav="1">${last?'Submit responses':'Next'}</button></div>`;
const welcome=()=>`<h1>Diet and mental wellbeing survey</h1><p class="sub">${TITLE}</p>
<div class="card"><p style="margin-top:0">Dear respondent, you are invited to take part in a research study on the dietary habits and mental wellbeing of tertiary institution students in Bauchi metropolis. It is purely academic and forms part of the requirements for the award of the Higher National Diploma (HND) in Nutrition and Dietetics.</p><p>Taking part is entirely voluntary and your answers will be treated with the strictest confidence. Please do not enter your name anywhere. Answer every question as honestly as you can. It takes about 15 minutes.</p>${CONFIG.RESEARCHER?`<p style="margin-bottom:0">Researcher: ${esc(CONFIG.RESEARCHER)}</p>`:''}</div>
<label class="chk"><input type="checkbox" id="c1"><span>I have read and understood the information above. I have had the opportunity to ask questions and received satisfactory answers. I understand that my participation is voluntary and that I may withdraw at any time.</span></label>
<label class="chk"><input type="checkbox" id="c2"><span>I agree to take two photos with my device camera: one of my face and one of my surroundings. The camera only works when I tap the button, it never records in the background, and each photo is taken only when I tap Capture. The photos are used only to confirm that this is a genuine response from a real student and are seen only by the researcher.${CONFIG.PHOTO_REQUIRED?' (Required for this study.)':' (Optional. You can take part without it.)'}</span></label>
<p id="err" class="err" hidden></p><button class="btn" data-act="begin">Start questionnaire</button>`;
const camBox=(k,n,t,d)=>`<div class="card cam ${k}" data-kind="${k}" data-state="idle"><h3 style="margin-top:0">${n}. ${t}</h3><p class="lead" style="margin:0 0 10px">${d}</p><div class="frame"><video playsinline muted></video><img alt="Your captured photo"><p class="ph">Camera is off</p></div><p class="cerr" hidden></p><div class="row"><button class="btn" data-act="start">Open camera</button><button class="btn" data-act="snap">Capture</button></div></div>`;
const photos=()=>`<h2>Photo check</h2><p class="lead">Take two photos. Use good light and hold the phone steady. Photos stay on your device until you submit.</p>${camBox('selfie',1,'Your face','Look at the camera so your face is clearly visible.')}${camBox('scene',2,'Your surroundings','Show the place where you are answering this questionnaire.')}${nav()}${CONFIG.PHOTO_REQUIRED?'':'<button class="link" data-act="skipphoto">Continue without photos</button>'}`;
function page(){
 if(step===0)return welcome();if(step===1)return photos();
 const S=[0,0,['Section A: Socio-demographic and economic information','Choose the answer that fits you or fill in the space provided.',SA.map(Q).join('')],
 ['Section B: Food frequency','How often do you consume the following foods? Choose the number that best describes your usual eating over the past one month.',ffqHTML()],
 ['Section C: Depression screening','Over the last two weeks, how often have you been bothered by any of the following problems?',L('phq',PHQ)],
 ['Section D: Anxiety screening','Over the last two weeks, how often have you been bothered by the following problems?',L('gad',GAD)],
 ['Section E: Additional questions','A few last questions.',SE.map(Q).join('')]][step];
 return `<h2>${S[0]}</h2><p class="lead">${S[1]}</p>${S[2]}${nav(step===6)}`;
}
function render(){
 stopCam();$('#app').innerHTML=page();
 $('#stepname').textContent=NAMES[step];$('#fill').style.width=(step/6*100)+'%';
 if(step===0){$('#c1').checked=C.ok;$('#c2').checked=C.photo}
 $$('.q').forEach(q=>{const k=q.dataset.k,v=A[k];if(v===undefined)return;
  const inp=$('input.in:not(.sp)',q);if(inp)inp.value=v;
  $$('.chip',q).forEach(c=>c.classList.toggle('on',c.dataset.v===String(v)));
  const sp=$('.sp',q);if(sp){sp.hidden=String(v)!==sp.dataset.sp;sp.value=A[k+'_other']||''}
  const sm=$('small',q);if(sm)sm.textContent=FL[v];
  if(k==='phq13')$('.care',q).hidden=!(v>0)});
 $$('.cam').forEach(b=>{if(P[b.dataset.kind]){$('img',b).src=P[b.dataset.kind];show(b,'done')}});
 window.scrollTo(0,0);
}
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3500)};
const flash=q=>{q.classList.add('bad');q.scrollIntoView({block:'center',behavior:'smooth'});toast('Please answer the highlighted question.')};
function need(){return $$('.q').find(q=>{const k=q.dataset.k,v=A[k];
 if(v===undefined||v===''||(typeof v==='number'&&isNaN(v)))return true;
 const n=$('input[type=number]',q);if(n&&!n.checkValidity())return true;
 const sp=$('.sp',q);return sp&&!sp.hidden&&!q.dataset.spopt&&!(A[k+'_other']||'').trim()})}
function go(d){
 if(d>0){if(step===1&&C.photo&&!(P.selfie&&P.scene))return toast('Please capture both photos, or choose Continue without photos.');
  if(step>1){const m=need();if(m)return flash(m)}}
 let to=step+d;if(to===1&&!C.photo)to=d>0?2:0;
 if(to>6)return submit();step=to;render();
}
/* camera: opens only on tap, stops after each capture */
function stopCam(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null}
function show(b,s){b.dataset.state=s;$('[data-act=start]',b).textContent=s==='done'?'Retake':'Open camera'}
async function startCam(b){
 stopCam();const k=b.dataset.kind,e=$('.cerr',b);e.hidden=true;
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){e.textContent='This browser cannot open the camera. Open the link in Chrome or Safari.';e.hidden=false;return}
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:k==='selfie'?'user':'environment'},width:{ideal:1280}},audio:false});
  const v=$('video',b);v.srcObject=stream;await v.play();show(b,'live')}
 catch(x){e.textContent=x.name==='NotAllowedError'?'Camera access was blocked. Allow the camera for this page in your browser settings, then tap Open camera.':'No usable camera was found on this device.';e.hidden=false}
}
function snap(b){
 const v=$('video',b),s=Math.min(1,720/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement('canvas');
 c.width=Math.round(v.videoWidth*s);c.height=Math.round(v.videoHeight*s);c.getContext('2d').drawImage(v,0,0,c.width,c.height);
 P[b.dataset.kind]=c.toDataURL('image/jpeg',.7);stopCam();$('img',b).src=P[b.dataset.kind];show(b,'done');
}
const sum=(p,n)=>Array.from({length:n},(_,i)=>A[p+(i+1)]).reduce((a,b)=>a+b,0);
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,8);
async function submit(){
 const btn=$('[data-nav="1"]');btn.disabled=true;btn.textContent='Sending…';
 const rec={id:uid(),submitted_at:new Date().toISOString(),tz:Intl.DateTimeFormat().resolvedOptions().timeZone,consent_photo:C.photo?'yes':'no',phq_total:sum('phq',13),gad_total:sum('gad',8),...A};
 if(!CONFIG.ENDPOINT){console.log(rec);return done(false)}
 try{await fetch(CONFIG.ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({rec,photos:C.photo?P:{}})});done(true)}
 catch(e){btn.disabled=false;btn.textContent='Submit responses';toast('Could not send. Check your internet connection and try again.')}
}
function done(sent){
 $('#fill').style.width='100%';$('#stepname').textContent='Complete';
 $('#app').innerHTML=`<h1>Thank you</h1><p class="lead">Thank you very much for your time and honest responses. You can now close this page.</p>${A.phq13>0?`<p class="care">${CARE}</p>`:''}${sent?'':'<p class="setup">Setup mode: no ENDPOINT is set, so nothing was sent. Add your Apps Script URL in CONFIG to start collecting responses.</p>'}`;
 window.scrollTo(0,0);
}
/* events */
document.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;
 if(t.dataset.nav)return go(+t.dataset.nav);
 const a=t.dataset.act;
 if(a==='begin'){const err=$('#err');C.ok=$('#c1').checked;C.photo=$('#c2').checked;
  if(!C.ok){err.textContent='Please tick the consent box to continue.';err.hidden=false;return}
  if(CONFIG.PHOTO_REQUIRED&&!C.photo){err.textContent='This study needs the photo check. If you do not agree, you may close this page.';err.hidden=false;return}
  A.consent_at=new Date().toISOString();return go(1)}
 if(a==='start')return startCam(t.closest('.cam'));
 if(a==='snap')return snap(t.closest('.cam'));
 if(a==='skipphoto'){P.selfie=P.scene=null;C.photo=false;stopCam();step=2;return render()}
 if(t.classList.contains('chip')){
  const q=t.closest('.q'),k=q.dataset.k,v=t.dataset.v;
  A[k]=q.dataset.n?Number(v):v;q.classList.remove('bad');
  $$('.chip',q).forEach(c=>c.classList.toggle('on',c===t));
  const sp=$('.sp',q);if(sp){sp.hidden=v!==sp.dataset.sp;if(sp.hidden){sp.value='';delete A[k+'_other']}else sp.focus()}
  const sm=$('small',q);if(sm)sm.textContent=FL[v];
  if(k==='phq13')$('.care',q).hidden=!(A[k]>0);
 }
});
document.addEventListener('input',e=>{
 const i=e.target;if(!i.classList.contains('in'))return;
 const q=i.closest('.q'),k=q.dataset.k;q.classList.remove('bad');
 if(i.classList.contains('sp'))A[k+'_other']=i.value.trim();
 else if(i.type==='number')A[k]=i.value===''?undefined:Number(i.value);
 else A[k]=i.value.trim();
});
render();
</script></body></html>
